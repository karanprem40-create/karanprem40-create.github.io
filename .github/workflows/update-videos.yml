name: Update YouTube videos

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab
  push:
    paths:
      - scripts/fetch-videos.mjs
      - .github/workflows/update-videos.yml

permissions:
  contents: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch videos from YouTube
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node scripts/fetch-videos.mjs

      - name: Commit videos.json if it changed
        run: |
          if git diff --quiet -- videos.json && git ls-files --error-unmatch videos.json >/dev/null 2>&1; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git commit -m "Update YouTube videos"
          git push
